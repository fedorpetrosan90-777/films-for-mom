<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кино для мамы</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px 20px;
            text-align: center;

            /* Твой фон */
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #1a1a2e; /* Запасной цвет, если картинка не загрузится */
        }

        /* Затемнение фона, чтобы белый текст и кнопки хорошо читались */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 15, 30, 0.45); /* Легкое затемнение (45%) */
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1; /* Чтобы карточка была поверх затемнения */
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
        }
        p.subtitle {
            font-size: 16px;
            color: #d0d0d0;
            margin-bottom: 36px;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.6);
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            border-radius: 20px;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.12s ease, box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active {
            transform: scale(0.97);
        }

        /* Главная кнопка — большая, пастельно-персиковая */
        .btn-primary {
            padding: 34px 24px;
            font-size: 28px;
            color: #4a2c24;
            background: linear-gradient(145deg, #ffd9c7 0%, #ffc9b5 100%);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
            gap: 12px;
        }

        /* Вторая кнопка — меньше, пастельно-голубая */
        .btn-secondary {
            padding: 20px 20px;
            font-size: 17px;
            color: #2c3e50;
            background: linear-gradient(145deg, #d6e8f2 0%, #c3dcea 100%);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .hint {
            margin-top: 34px;
            font-size: 14px;
            color: #cccccc;
            line-height: 1.55;
            max-width: 340px;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.8);
        }

        .icon {
            font-size: 1.15em;
            line-height: 1;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Кино для мамы</h1>
        <p class="subtitle">Всё в одном месте</p>

        <!-- ЗАМЕНИ ССЫЛКУ НА АКТУАЛЬНОЕ ЗЕРКАЛО ЗАГОНКИ -->
        <a class="btn btn-primary" href="http://zagonka06.zagonkop.gb.net/u" target="_blank" rel="noopener">
            <span class="icon">🎬</span> Загонка
        </a>

        <!-- ЗАМЕНИ ССЫЛКУ НА СВОЕГО БОТА -->
        <a class="btn btn-secondary" href="https://t.me/ZagonkaSite" target="_blank" rel="noopener">
            🆘 Сайт не работает — жми сюда
        </a>

        <p class="hint">
            Если кнопка «Загонка» не открывает сайт — нажми вторую. Там будут свежие ссылки.
        </p>
    </div>

</body>
</html>
